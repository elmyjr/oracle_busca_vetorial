
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca Semântica de Filmes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #20242a;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 24px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            font: inherit;
        }

        button {
            margin-top: 12px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #25364a;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin-top: 20px;
            line-height: 1.5;
        }

        #resultados {
            padding: 0;
            list-style: none;
        }

        #resultados li {
            margin: 12px 0;
            padding: 16px;
            border: 1px solid #e0e3e8;
            border-radius: 8px;
        }

        .distancia {
            color: #5a626c;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            main {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Busca Semântica de Filmes</h1>

        <p>
            Descreva o filme que gostaria de assistir.
            A busca retorna os três títulos mais próximos
            semanticamente da sua pergunta.
        </p>

        <form id="form-busca">
            <label for="pergunta">O que você gostaria de assistir?</label>

            <input 
                type="text"
                id="pergunta"
                maxlength="2000"
                placeholder="Ex.: Um filme que questiona a natureza da realidade"
                required
            >

            <button id="botao-buscar" type="submit">
                Buscar filmes
            </button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
        <ol id="resultados"></ol>
    </main>

    <script>
        const formulario = document.getElementById("form-busca");
        const campoPergunta = document.getElementById("pergunta");
        const botao = document.getElementById("botao-buscar");
        const status = document.getElementById("status");
        const lista = document.getElementById("resultados");

        formulario.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const pergunta = campoPergunta.value.trim();

            if (!pergunta) {
                status.textContent = "Digite uma pergunta para pesquisar.";
                return;
            }

            botao.disabled = true;
            status.textContent = "Pesquisando filmes...";
            lista.replaceChildren();

            try {
                const resposta = await fetch("/search", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ pergunta })
                });

                const dados = await resposta.json().catch(() => ({}));

                if (!resposta.ok) {
                    const mensagem =
                        typeof dados.detail === "string"
                            ? dados.detail
                            : "Não foi possível realizar a busca.";

                    throw new Error(mensagem);
                }

                if (dados.resultados.length === 0) {
                    status.textContent = "Nenhum filme encontrado.";
                    return;
                }

                dados.resultados.forEach((filme, indice) => {
                    const item = document.createElement("li");
                    const titulo = document.createElement("h2");
                    const distancia = document.createElement("p");

                    titulo.textContent = `${indice + 1}. ${filme.titulo}`;

                    distancia.className = "distancia";
                    distancia.textContent =
                        `Distância cosseno: ${filme.distancia.toFixed(4)}`;

                    item.append(titulo, distancia);
                    lista.appendChild(item);
                });

                status.textContent =
                    `${dados.resultados.length} resultado(s) encontrado(s).`;

            } catch (erro) {
                if (erro instanceof TypeError) {
                    status.textContent = "Não foi possível conectar à API.";
                } else {
                    status.textContent =
                        erro.message || "Não foi possível realizar a busca.";
                }
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
